name: One-time approved RoboQuo maker logo asset sync
on:
  push:
    branches:
      - release/roboquo-approved-makers-20261114
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install image validator
        run: python -m pip install Pillow==11.3.0
      - name: Download authentic source logos and verify bytes
        run: python tools/sync-approved-maker-logos.py
      - name: Commit verified source artwork to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maker-logos/*-approved.png assets/maker-logos/APPROVED_SOURCES_20261114.json
          git commit -m "Attach actual vendor logo assets to approved RoboQuo release" || exit 0
          git push origin HEAD:release/roboquo-approved-makers-20261114
