name: Verify AMR AGV manufacturer directory
on:
  pull_request:
    paths:
      - 'amr-makers.js'
      - 'amr-makers.css'
      - 'amr-maker-sources.json'
      - 'amr-maker-local-map.js'
      - 'index.html'
      - 'tests/amr-makers-*.cjs'
      - 'tools/sync-amr-logos.py'
      - '.github/workflows/verify-amr-makers.yml'
  push:
    branches: [main]
    paths:
      - 'amr-makers.js'
      - 'amr-makers.css'
      - 'amr-maker-sources.json'
      - 'amr-maker-local-map.js'
      - 'index.html'
      - 'assets/amr-logos/**'
      - 'tests/amr-makers-*.cjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify makers, metadata, and image fallback
        run: |
          node tests/amr-makers-regression.cjs
          python -m py_compile tools/sync-amr-logos.py
      - name: Install Chromium
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test manufacturer navigation on desktop and mobile without production DB
        run: node tests/amr-makers-browser.cjs
