name: One-time trim authentic maker wordmarks
on:
  push:
    branches:
      - fix/roboquo-mobile-logo-copy-20261114
permissions:
  contents: write
jobs:
  logo-crop:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install raster image converters
        run: python -m pip install Pillow==11.3.0 CairoSVG==2.8.2
      - name: Trim blank margins from original maker marks
        run: python tools/crop-authentic-wordmarks.py
      - name: Commit only verified, source-derived logo images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/maker-logos/fanuc-trimmed-20261114.png assets/maker-logos/onrobot-trimmed-20261114.png assets/maker-logos/schunk-trimmed-20261114.png assets/maker-logos/TRIMMED_WORDMARKS_20261114.json
          git commit -m "Crop empty space around three authentic OEM marks" || exit 0
          git push origin HEAD:fix/roboquo-mobile-logo-copy-20261114
